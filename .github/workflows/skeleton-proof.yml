# RAD-13's proof on a fresh runner: npm ci, tests (fixtures included), lint, typecheck, and the dev compose
# services started from generated credentials, with the object store's smoke test. RAD-14 (M0-08) replaces this with the full CI pipeline.
name: skeleton-proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Dev compose on 127.0.0.1 with generated credentials (RC-198)
        run: |
          npm run db:up
          docker compose -f compose.dev.yml port postgres 5432 | grep -x '127.0.0.1:5432'
          docker compose -f compose.dev.yml port seaweedfs 8333 | grep -x '127.0.0.1:8333'
          docker compose -f compose.dev.yml exec -T postgres psql -U radcore -d radcore -tAc 'show server_version' | grep '^16\.'
      - name: Object store smoke test (presigned PUT and GET)
        run: |
          set -a; . ./.env; set +a
          npx vitest run --project tools tools/s3.test.ts
