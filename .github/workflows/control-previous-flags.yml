# Scans every commit reachable from the commit under test (not other branches), on every PR and every push (RAD-6, RC-006).
# Stands in for GitHub secret scanning, which this private repo's plan does not include.
# The gitleaks CLI (MIT) is used directly: gitleaks-action v2+ is not MIT and needs a key in an organisation.
# What a PR could use to hide a secret, and how each is closed: its own .gitleaks.toml (--config points outside the
# checkout), its .gitleaksignore (deleted first), inline gitleaks:allow (--ignore-gitleaks-allow), a .gitattributes
# "-diff"/"binary" line (--text), and content added only in a merge commit (--diff-merges=first-parent).
# Known limits (gitleaks' defaults): its built-in allowlist skips lockfiles, node_modules/, vendor/, images and
# binaries; UTF-16 files, archives, Git LFS objects and commit messages are not read. A PR can also edit this
# workflow itself; with no branch protection on this plan, review of .github/ changes is the guard.
name: control-previous-flags

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks-previous-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Dependabot does not see these two lines: bump the version and its checksum together, by hand.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/gitleaks-ignore"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          # gitleaks always loads <scanned folder>/.gitleaksignore, whatever --gitleaks-ignore-path says
          # (cmd/root.go:317 at v8.30.1). The scan reads git history, so removing the working-tree copy loses nothing.
          rm -rf .gitleaksignore
      - name: Scan the history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --verbose --redact --no-banner --exit-code 1
          --config "$RUNNER_TEMP/gitleaks.toml"
          --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore"
          --ignore-gitleaks-allow
          --log-opts=HEAD .
