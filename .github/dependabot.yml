# Dependency updates (RAD-6, RC-006). PRs belong to RAD-16.
# The npm entry came with the root package.json (RAD-13).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # ADR-003 §4: versions must be 14 days old. Security updates are not held back by the cooldown.
    cooldown:
      default-days: 14
  # ADR-003's check fixtures pin bad versions on purpose (C5 needs a known advisory, C4 a bad licence, C8 a bad
  # lockfile). An update there breaks the check it proves, so every dependency is ignored, which stops security
  # updates there too (RAD-16, PR #28).
  - package-ecosystem: npm
    directories:
      - /tools/boundary-fixtures/*
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
